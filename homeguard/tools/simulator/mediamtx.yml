# HomeGuard simulator: fake NVR (3 channels) + door station video.
# Camera paths:  /cam1_main  /cam1_sub  ... /cam3_sub
# Door station:  /door_main  /door_sub
# Login: admin / admin123 (RTSP Digest auth, like a real NVR).
logLevel: info
rtspAddress: :8554
protocols: [tcp]
rtspAuthMethods: [digest]
rtmp: no
hls: no
webrtc: no
srt: no
api: no

authMethod: internal
authInternalUsers:
  # The app
  - user: admin
    pass: admin123
    ips: []
    permissions:
      - action: read
  # The built-in ffmpeg test-pattern publishers (same container only)
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: publish

pathDefaults:
  runOnDemandRestart: yes
  runOnDemandCloseAfter: 15s

# Streams start only when the app opens them, so the PC stays idle otherwise.
paths:
  "~^(cam[1-3]|door)_main$":
    runOnDemand: >-
      ffmpeg -nostdin -loglevel error -re
      -f lavfi -i testsrc2=size=1280x720:rate=15
      -f lavfi -i sine=frequency=440:sample_rate=8000
      -c:v libx264 -preset ultrafast -tune zerolatency -g 15 -pix_fmt yuv420p
      -c:a pcm_mulaw -ar 8000 -ac 1
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/$MTX_PATH
  "~^(cam[1-3]|door)_sub$":
    runOnDemand: >-
      ffmpeg -nostdin -loglevel error -re
      -f lavfi -i testsrc2=size=640x360:rate=15
      -c:v libx264 -preset ultrafast -tune zerolatency -g 15 -pix_fmt yuv420p
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/$MTX_PATH
